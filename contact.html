<body data-page="contact" data-title="nav.contact">

<header id="site-header"></header>
<main id="main">

<section class="page-hero"><div class="wrap"><hr class="rule"><h1 data-i18n="ct.title"></h1><p class="lead" data-i18n="ct.lead"></p></div></section>
<section class="alt"><div class="wrap split" style="align-items:start">
  <div>
    <div class="actions" id="contact-links" style="margin-top:0"></div>
    <p class="muted hidden" id="resp"></p>
    <div class="photo" style="margin-top:1.5rem"><img src="assets/extra-heart-model.jpg" width="720" height="467" alt="Anatomical heart model on a wooden desk" loading="lazy"></div>
  </div>
  <form class="panel" id="contact-form" novalidate>
    <label><span data-i18n="ct.name"></span><input name="name" required autocomplete="name" maxlength="120"></label>
    <label><span data-i18n="ct.email"></span><input name="email" type="email" required autocomplete="email" maxlength="160"></label>
    <label><span data-i18n="ct.msg"></span><textarea name="message" required maxlength="3000"></textarea></label>
    <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <label class="check"><input type="checkbox" name="consent" required><span data-i18n="ct.consent"></span></label>
    <button class="btn gold" type="submit" data-i18n="ct.send"></button>
    <p class="status hidden" id="contact-status" role="status"></p>
  </form>
</div></section>

</main>
